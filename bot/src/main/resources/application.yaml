app:
  telegram-token: ${TELEGRAM_TOKEN} # env variable
  baseUrl: ${CLIENT_BASE_URL:http://localhost:8081} # env variable

  kafka:
    topics:
      dlq: "updates_dlq"
      updater: "updates"
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: "bot"
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: backend.academy.common.model.LinkUpdate
        spring.json.use.type.headers: false
        spring.json.trusted.packages: backend.academy.common.model
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  cache:
    type: redis
  application:
    name: Bot
  liquibase:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
server:
  port: 8080
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui
